  <script>try{localStorage.getItem('scaid:theme')==='dark'&&(document.documentElement.dataset.theme='dark')}catch(e){}document.documentElement.classList.add('is-intro');setTimeout(function(){document.documentElement.classList.remove('is-intro')},6000)</script>

<body>

  <div id="site-header"></div>

  <!-- 教師詳細頁（從 faculty.html 列表點進來，user 2026-11-10 草圖）：左上角返回鈕（詳細頁不放段落導覽，user 2026-11-18）、col 2–7 內文、右圖同其他內頁。
       頁頭＝照片在上、下面名字＋副標一行一個（user 2026-11-21：上下排；試過照片放左邊、同列表那一列）——文字就是列表那一列的文字（純文字的 div.item-row＝不能點，名字是這頁的 h1、一樣 text-md）；
       學歷／經歷…＝同關於的 Subsection title（h3）＋下面一筆一筆：年份一行、下面一行說明（後台 year＋text_*；沒年份的專長＝只有說明那一行），筆與筆之間＝標題到第一筆的距離（user 2026-11-23；2026-11-21 是不空，原本每段一個 Section title＋空行隔開的條列）。
       一組（標題＋那幾筆）一塊 .subsection、包在 .subsections＝同關於的小節：組與組之間＝容器的 gap lg、同動態的清單列（user 2026-11-24：「所有的 list 的 gap 都調整跟 activities 的一樣」；原本靠 h3 的上距 md）。
       清單（學歷、經歷…）後台可以自己加（user 2026-11-24：「跟關於一樣，我們可以自己加 list」＝子集合 faculty_sections：標題＋一筆一筆）：標題是內容、不是介面文字（不標 data-label）；
       先開學歷、經歷兩個，原本的專長、展覽、獲獎、著作 user 說刪掉。
       內容為 MOCK 示意；接 Directus 後用 ?id= 抓那位老師、由模組渲染。名字／副標跟語言走（同列表，user 2026-11-18） -->
  <main id="page-content">
    <div class="site-container site-grid">
      <a href="faculty.html" class="back-btn"><span class="icon icon-back" aria-hidden="true"></span><span data-label="faculty.back" class="sr-only" data-en="Back to Faculty">返回師資</span></a>

      <article class="page-body col-span-full md:col-start-4 md:col-span-6 pc:col-start-2">
        <div class="profile-photo"></div>
        <div class="item-row">
          <h1 data-en="Lee Chun-Chieh (placeholder)">李俊傑（示意）</h1>
          <p data-en="Program Director">學程主任</p>
          <p data-en="Professor">教授</p>
        </div>

        <section class="page-section">
          <div class="subsections">
            <div class="subsection">
              <h3 data-en="Education">學歷</h3>
              <ul>
                <li><p>2008</p><p data-en="PhD in Digital Arts, Placeholder University">示意大學 數位藝術研究所 博士</p></li>
                <li><p>2002</p><p data-en="BA in Visual Communication Design, Placeholder University">示意大學 視覺傳達設計學系 學士</p></li>
              </ul>
            </div>

            <div class="subsection">
              <h3 data-en="Experience">經歷</h3>
              <ul>
                <li><p>2020–</p><p data-en="Director, Bachelor Program in Advanced Integrated Design, Shih Chien University (placeholder)">實踐大學 AI 設計職人學位學程 主任（示意）</p></li>
                <li><p>2012–2020</p><p data-en="Technical Director, Placeholder Animation Co.">示意動畫公司 技術總監</p></li>
                <li><p>2008–2012</p><p data-en="Compositor, Placeholder Post-production">示意後製公司 合成師</p></li>
              </ul>
            </div>
          </div>
        </section>
      </article>

      <!-- TODO 圖片待 user 給 -->
      <div class="page-figure hidden pc:block md:col-start-8 md:col-span-5"><div data-label="common.image" data-en="Image">圖片</div></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>

  <script src="../js/utils/helpers.js"></script>
  <script type="module" src="../js/main.js"></script>
