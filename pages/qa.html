<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no, email=no, address=no">
  <script>try{localStorage.getItem('scaid:theme')==='dark'&&(document.documentElement.dataset.theme='dark')}catch(e){}document.documentElement.classList.add('is-intro');setTimeout(function(){document.documentElement.classList.remove('is-intro')},6000)</script>
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg?v=2">
  <title>常見問題 - SCAID</title>
  <link rel="stylesheet" href="../fonts/glow-sans-tc-compressed/font.css?v=f67c9f10">
  <link rel="stylesheet" href="../css/output.css">
</head>
<body>

  <div id="site-header"></div>

  <!-- 內頁：只有 <main> 會被 SPA swap 進去；直接開 /pages/qa.html 也能獨立跑。版型同 about（css/components/page.css）。
       排法同課程（user 2026-11-23：「QA 應該是像課程一樣的排版」）：分類＝Section title（有段落導覽），一題一個摺疊（清單列 summary.item-row），外面＝問題（標題 h3，text-md），點開＝答案（.fold-body，text-s）。
       內容為 MOCK 示意，接 Directus 後改由模組渲染。文字依語言切換：中文寫內文、英文寫 data-en（lang.js） -->
  <main id="page-content">
    <div class="site-container site-grid">
      <nav class="section-nav flex" aria-label="本頁段落" data-en-label="Sections on this page"></nav>

      <article class="page-body col-span-full md:col-start-4 md:col-span-6 pc:col-start-2">
        <h1 data-label="nav.qa" data-en="QA">常見問題</h1>

      <section class="page-section">
        <h2 class="section-title" data-en="Admission and Application">入學與申請</h2>
        <ul class="item-list">
          <li><details>
            <summary class="item-row">
              <h3 data-en="Can I apply without a design background?">沒有設計背景可以申請嗎？</h3>
            </summary>
            <div class="fold-body">
              <p data-en="Yes. Year 1 starts from foundations in aesthetics and AI tools; no prior portfolio is required.">可以。一年級從基礎美學與 AI 工具開始，不要求先備作品。</p>
            </div>
          </details></li>
          <li><details>
            <summary class="item-row">
              <h3 data-en="Do I need a portfolio to apply?">申請需要準備作品集嗎？</h3>
            </summary>
            <div class="fold-body">
              <p data-en="It depends on the admission route; see the Admission page.">依各入學管道規定，請見「入學」頁。</p>
            </div>
          </details></li>
        </ul>
      </section>

      <section class="page-section">
        <h2 class="section-title" data-en="Courses and Internship">課程與實習</h2>
        <ul class="item-list">
          <li><details>
            <summary class="item-row">
              <h3 data-en="Is the Year 4 internship paid?">四年級實習有薪水嗎？</h3>
            </summary>
            <div class="fold-body">
              <p data-en="Yes, with a basic monthly salary plus labour and health insurance, assessed jointly by a company supervisor and a school advisor.">有，享基本月薪與勞健保，由企業主管與學校導師共同考核。</p>
            </div>
          </details></li>
          <li><details>
            <summary class="item-row">
              <h3 data-en="How are internship placements decided?">實習企業怎麼分配？</h3>
            </summary>
            <div class="fold-body">
              <p data-en="Through partner-company interviews and project matching in the second semester of Year 3.">三年級下學期參加合作企業的面試與專案媒合。</p>
            </div>
          </details></li>
        </ul>
      </section>

      <section class="page-section">
        <h2 class="section-title" data-en="Scholarship">助學金</h2>
        <ul class="item-list">
          <li><details>
            <summary class="item-row">
              <h3 data-en="How do I apply for the scholarship?">助學金怎麼申請？</h3>
            </summary>
            <div class="fold-body">
              <p data-en="NT$10,000 per semester, handled by the program after enrolment; no separate application.">每學期 10,000 元，入學後由學程統一辦理，不需另外申請。</p>
            </div>
          </details></li>
        </ul>
      </section>
      </article>

      <!-- TODO 圖片待 user 給 -->
      <div class="page-figure hidden pc:block md:col-start-8 md:col-span-5"><div data-label="common.image" data-en="Image">圖片</div></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollToPlugin.min.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script type="module" src="../js/main.js"></script>

</body>
</html>
