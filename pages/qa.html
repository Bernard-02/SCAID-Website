<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no, email=no, address=no">
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg?v=2">
  <title>常見問題 - SCAID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&family=Noto+Sans+TC:wght@400..700&display=swap">
  <link rel="stylesheet" href="../css/output.css">
</head>
<body>

  <div id="site-header"></div>

  <!-- 內頁：只有 <main> 會被 SPA swap 進去；直接開 /pages/qa.html 也能獨立跑。內容為 MOCK 示意，接 Directus 後改由模組渲染。
       文字依語言切換：中文寫內文、英文寫 data-en（lang.js） -->
  <main id="page-content">
    <section class="site-container py-2xl">
      <h1 class="text-2xl" data-en="QA">常見問題</h1>
      <!-- 原生 <details>＝免 JS 手風琴 -->
      <div class="mt-xl border-t border-current">
        <details class="py-md border-b border-current"><summary class="cursor-pointer font-bold" data-en="Placeholder: question one?">示意：常見問題一？</summary><p class="mt-sm" data-en="Placeholder: answer one.">示意回答一。</p></details>
        <details class="py-md border-b border-current"><summary class="cursor-pointer font-bold" data-en="Placeholder: question two?">示意：常見問題二？</summary><p class="mt-sm" data-en="Placeholder: answer two.">示意回答二。</p></details>
        <details class="py-md border-b border-current"><summary class="cursor-pointer font-bold" data-en="Placeholder: question three?">示意：常見問題三？</summary><p class="mt-sm" data-en="Placeholder: answer three.">示意回答三。</p></details>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollToPlugin.min.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script type="module" src="../js/main.js"></script>

</body>
</html>
