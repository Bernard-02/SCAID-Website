<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no, email=no, address=no">
  <!-- 作品頁一律深色（user 2026-11-23）：不看 localStorage 直接暗；離開時 chrome.js syncPageTheme 回到存的那種 -->
  <script>(function(){var K='scaid:theme',S,t,a,h=new Date().getHours(),n=h>=6&&h<18?'light':'dark';try{S=sessionStorage;t=S.getItem(K);a=S.getItem(K+'-auto')}catch(e){}if(t!=='dark'&&t!=='light'){t=n;a='1'}else if(a&&t!==n){t=n;a=''}try{S.setItem(K,t);a?S.setItem(K+'-auto','1'):S.removeItem(K+'-auto')}catch(e){}})();document.documentElement.dataset.theme='dark';document.documentElement.classList.add('is-intro');setTimeout(function(){document.documentElement.classList.remove('is-intro')},6000)</script>
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg?v=3">
  <meta name="description" content="SCAID - Works 實踐大學 AI 設計職人學士學位學程 - 作品">
  <link rel="canonical" href="https://scaid.usc.edu.tw/works">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SCAID - Bachelor Program in Advanced Integrated Design, Shih Chien University 實踐大學 AI 設計職人學士學位學程">

</head>
<body>

  <div id="site-header"></div>

  <!-- 作品（user 2026-11-23）：像電影院——整頁深色、沒有右圖（不放 .page-figure）、內容置中（md 起中間 8 欄）。
       兩種排法：放映（slideshow，一次一個在正中、前後兩個躲在後面）／總覽（bento，照比例排成幾欄），底列中間那組鈕切（header.html .bar-works）。
       每個作品照自己的比例與大小、只限最大寬；每次進來順序都打亂；影片在放映時點了就地播、可以全螢幕，圖片不放大。行為 js/modules/pages/works.js、版型 css/components/works.css。
       內容只從後台來（單例 works 的 YouTube 播放清單＋圖片欄位，works.js 填進空的 .works-items；user 2026-11-26 起不放示意） -->
  <main id="page-content">
    <div class="site-container site-grid">
      <article class="page-body works col-span-full md:col-start-4 md:col-span-6" data-mode="slideshow">
        <h1 class="sr-only" data-label="nav.works" data-en="Works">作品</h1>   <!-- 標題不出（user 2026-11-24：「作品頁的 title 可以拿掉」）、只留給報讀（同首頁）；作品從 title 那條線排起 -->
        <p class="coming-soon" data-label="page.coming-soon" data-en="Coming soon">即將推出</p>   <!-- 後台「即將推出」勾了這一頁才出、在 Hero 下面那塊的正中（coming-soon.js；user 2026-11-25） -->
        <div class="works-items"></div>
      </article>
    </div>
  </main>

  <script src="../js/utils/helpers.js"></script>
  <script type="module" src="../js/main.js"></script>

</body>
</html>
