<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no, email=no, address=no">
  <script>try{localStorage.getItem('scaid:theme')==='dark'&&(document.documentElement.dataset.theme='dark')}catch(e){}document.documentElement.classList.add('is-intro');setTimeout(function(){document.documentElement.classList.remove('is-intro')},6000)</script>
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg?v=2">
  <title>合作企業 - SCAID</title>
  <link rel="stylesheet" href="../fonts/glow-sans-tc-compressed/font.css?v=f67c9f10">
  <link rel="stylesheet" href="../css/output.css">
</head>
<body>

  <div id="site-header"></div>

  <!-- 內頁：只有 <main> 會被 SPA swap 進去；直接開 /pages/partners.html 也能獨立跑。版型同 about（css/components/page.css）。
       內容為 MOCK 示意；跟師資同一種列（縮圖＋名稱＋副標一行一個 p，user 2026-11-21），js/modules/ui/item-list-cms.js 照 data-cms="partners" 換成後台資料（後台還沒任何一筆／抓不到＝留這份 MOCK；url 空＝那列用 div 不用 a）。
       整列是外連 a.item-row、另開新視窗（user 2026-11-18）。企業名稱＝標題 text-md、副標 text-s（同師資列表，page.css .item-row）。文字依語言切換：中文寫內文、英文寫 data-en（lang.js） -->
  <main id="page-content">
    <div class="site-container site-grid">
      <article class="page-body col-span-full md:col-start-4 md:col-span-6 pc:col-start-2">
        <h1 class="sr-only" data-label="nav.partners" data-en="Partners">合作企業</h1>
        <p class="page-lead" data-en="Six companies co-educating with the program across animation, games, XR, post-production and interactive exhibits.">與學程雙軌共育的 6 家企業，涵蓋動畫、遊戲、XR、後製與互動展演。</p>

      <section class="page-section">
        <ul class="item-list mt-0" data-cms="partners">
          <li><a class="item-row" href="https://example.com/animation-studio" target="_blank" rel="noopener">
            <div class="item-thumb"></div>
            <div>
              <h3 data-en="Placeholder Animation Studio">示意動畫工作室</h3>
              <p data-en="Co-teaching, Year 3 project briefs, Year 4 full-year internships">協同授課、三年級專案命題、四年級全年實習</p>
            </div>
          </a></li>
          <li><a class="item-row" href="https://example.com/games" target="_blank" rel="noopener">
            <div class="item-thumb"></div>
            <div>
              <h3 data-en="Placeholder Games">示意遊戲開發公司</h3>
              <p data-en="Mentors in class, art-pipeline workshops">業師進班、美術管線工作坊</p>
            </div>
          </a></li>
          <li><a class="item-row" href="https://example.com/xr-studio" target="_blank" rel="noopener">
            <div class="item-thumb"></div>
            <div>
              <h3 data-en="Placeholder XR Studio">示意 XR 製作公司</h3>
              <p data-en="Virtual production equipment, internships">虛擬製作設備支援、實習</p>
            </div>
          </a></li>
          <li><a class="item-row" href="https://example.com/post-production" target="_blank" rel="noopener">
            <div class="item-thumb"></div>
            <div>
              <h3 data-en="Placeholder Post-production">示意影像後製公司</h3>
              <p data-en="Project briefs, mentor talks">專案命題、業師講座</p>
            </div>
          </a></li>
          <li><a class="item-row" href="https://example.com/interactive-exhibits" target="_blank" rel="noopener">
            <div class="item-thumb"></div>
            <div>
              <h3 data-en="Placeholder Interactive Exhibits">示意互動展演設計公司</h3>
              <p data-en="Exhibition projects, internships">展演專案合作、實習</p>
            </div>
          </a></li>
          <li><a class="item-row" href="https://example.com/content-platform" target="_blank" rel="noopener">
            <div class="item-thumb"></div>
            <div>
              <h3 data-en="Placeholder Digital Content Platform">示意數位內容平台</h3>
              <p data-en="Scholarships, job matching">獎助學金、就業媒合</p>
            </div>
          </a></li>
        </ul>
      </section>
      </article>

      <!-- TODO 圖片待 user 給 -->
      <div class="page-figure hidden pc:block md:col-start-8 md:col-span-5"><div data-label="common.image" data-en="Image">圖片</div></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollToPlugin.min.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script type="module" src="../js/main.js"></script>

</body>
</html>
