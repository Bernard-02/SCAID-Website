  <!-- 內頁：只有 <main> 會被 SPA swap 進去；直接開 /pages/activities.html 也能獨立跑。版型同 about（css/components/page.css）。
       沒有段落導覽（左邊的 anchor 方塊；user 2026-11-18），也不分年份（user 2026-11-21 拿掉年份標題）：一整串由新到舊。
       每則＝一個摺疊（原生 <details>，user 2026-11-18）：收著的樣子同師資那一列（縮圖＋標題＋副標），時間不寫在外面；
       點了展開＝時間、地點（沒有就不出那一行），下面相簿（沒有就不出）；點相簿的圖放大到整個畫面（chrome.js openFigure）。
       後台照 SCCD 的活動（user 2026-11-24）：標題下面是副標（一筆一行、可以沒有；原本一行「分類」）、地點可以好幾個（一個一行）、
       影片（button.album-video[data-video]）排在相簿的照片前面＝YouTube 的縮圖＋一顆 play，點了在放大畫面播。
       樣式見 page.css「摺疊」「動態」。相簿圖暫時是 Lorem Picsum stock（彩色，user 2026-11-19）。
       相簿的 <img> 一定要寫原圖 width／height（user 2026-11-19）：圖還沒載進來就知道寬 → 一打開就排好、chevron 當下就決定出不出
       （沒寫＝寬 0，載完才跳出 chevron）。接 Directus 後從檔案的 width／height 帶。
       內容只從後台來（user 2026-11-26，照 SCCD：不放假資料）：這裡只放空的容器、由模組填；抓不到又沒有上次抓到的＝不畫（main.js settle）。文字依語言切換：中文寫內文、英文寫 data-en（lang.js） -->
